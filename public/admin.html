<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PhonesNBO Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F6; --card:#fff; --ink:#15181C; --muted:#5B6470; --line:#DDE1E6;
  --blue:#3B8EF0; --blue-dk:#2A78D6; --blue-bg:#E7F1FD; --sticker:#FFD23F;
  --new:#2A78D6; --new-bg:#E7F1FD; --conf:#7A4FD0; --conf-bg:#F0EAFB; --out:#B26A00; --out-bg:#FFF2DC;
  --done:#11643A; --done-bg:#DDF3E5; --cancel:#8A9099; --cancel-bg:#EEF0F2; --danger:#B3261E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hidden{display:none!important}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px;width:min(380px,100%);display:grid;gap:14px}
.login h1{margin:0;font-size:24px;font-variation-settings:"wdth" 125;font-weight:900}
.login h1 span,.brand span{color:var(--blue)}
.login p{margin:0;color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside.side{background:var(--ink);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:900;font-size:20px;font-variation-settings:"wdth" 125;padding:4px 10px 18px}
.brand small{display:block;font-weight:500;font-size:12px;color:#9AA3AD;font-variation-settings:"wdth" 100}
.nav button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;color:#C9CFD6;padding:10px 12px;border-radius:10px;font-weight:600}
.nav button:hover{background:#22272E;color:#fff}
.nav button[aria-current="page"]{background:#2B313A;color:#fff}
.nav .pill{background:var(--blue);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;min-width:22px;text-align:center}
.side .grow{flex:1}
.side .foot{font-size:13px;color:#9AA3AD;padding:10px 12px;display:grid;gap:8px}
.side .foot a,.side .foot button{color:#C9CFD6;background:none;border:0;padding:0;text-align:left;text-decoration:underline}
main{padding:28px 32px 60px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.head h1{margin:0;font-size:28px;letter-spacing:-.02em;font-variation-settings:"wdth" 112}
.head .sub{color:var(--muted);font-size:14px}
.demo{background:#FFF6D6;border:1px solid #F2DE96;border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:14px}

/* generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#B9C0C9}
.btn.primary{background:var(--blue-dk);border-color:var(--blue-dk);color:#fff}
.btn.primary:hover{background:#1F63B8}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input.in,select.in,textarea.in{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;width:100%}
.f{display:grid;gap:5px;font-weight:600;font-size:14px}
.err{color:var(--danger);font-size:13px;min-height:1em}
.status{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.s-new{background:var(--new-bg);color:var(--new)}
.s-confirmed{background:var(--conf-bg);color:var(--conf)}
.s-out{background:var(--out-bg);color:var(--out)}
.s-delivered{background:var(--done-bg);color:var(--done)}
.s-cancelled{background:var(--cancel-bg);color:var(--cancel)}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--sticker);color:var(--ink)}
.tag.late{background:#FDE3E1;color:var(--danger)}
.tag.paid{background:var(--done-bg);color:var(--done)}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);visibility:hidden;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:90;transition:transform .25s,visibility .25s}
.toast.show{transform:translate(-50%,0);visibility:visible}

/* overview */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{padding:18px}
.stat .n{font-size:30px;font-weight:850;font-variation-settings:"wdth" 112;line-height:1.1}
.stat .l{color:var(--muted);font-size:14px}
.stat.hl{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat.hl .l{color:#B9C0C9}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.panel{padding:18px}
.panel h2{margin:0 0 12px;font-size:17px}
.mini{width:100%;border-collapse:collapse}
.mini td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
.mini tr{cursor:pointer}
.mini tr:hover td{background:#F7F8FA}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;background:var(--blue);border-radius:6px 6px 2px 2px;min-height:3px}
.bars span{font-size:11.5px;color:var(--muted)}
.bars b{font-size:11.5px}
.empty{padding:26px;text-align:center;color:var(--muted)}

/* orders */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button .c{opacity:.7;margin-left:4px;font-weight:500}
.toolbar .search{flex:1;min-width:200px}
.toolbar select{width:auto}
table.orders{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table.orders th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:11px 12px;border-bottom:1px solid var(--line);background:#FAFBFC}
table.orders td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
table.orders tr.row{cursor:pointer}
table.orders tr.row:hover td{background:#F7F8FA}
table.orders tr.sel td{background:var(--blue-bg)!important}
table.orders .ref{font-weight:800}
table.orders .num{text-align:right;white-space:nowrap;font-weight:700}

/* order drawer */
.scrim{position:fixed;inset:0;background:rgba(21,24,28,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--paper);z-index:50;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
body.dopen .scrim{opacity:1;pointer-events:auto}
body.dopen .drawer{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card)}
.dhead h2{margin:0;font-size:20px}
.x{border:0;background:none;font-size:26px;line-height:1;padding:2px 8px}
.dbody{flex:1;overflow:auto;padding:18px 20px;display:grid;gap:14px;align-content:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.box h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.cust b{font-size:17px}
.cust .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0}
.items small{display:block;color:var(--muted)}
.sum{display:flex;justify-content:space-between;padding:3px 0}
.sum.big{font-weight:800;font-size:17px;padding-top:8px}
.flow{display:grid;gap:8px}
.flow .next{width:100%;justify-content:center;padding:12px;font-size:15px}
.flow .row2{display:flex;gap:8px;flex-wrap:wrap}
.paybox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hist{list-style:none;margin:0;padding:0;font-size:13.5px}
.hist li{padding:5px 0 5px 16px;position:relative}
.hist li::before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--blue)}

/* products & delivery */
.grid-cards{display:grid;gap:14px}
.prod{padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:12px 18px;align-items:start}
.prod h3{margin:0;font-size:17px}
.prod .meta{color:var(--muted);font-size:13.5px}
.prod .ctrls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.prod .price{display:flex;align-items:center;gap:6px}
.prod .price input{width:110px}
.colours{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 11px 5px 6px;font-size:13.5px;background:#fff}
.chip i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.chip.off{opacity:.55;text-decoration:line-through}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;user-select:none}
.switch input{appearance:none;width:38px;height:22px;border-radius:999px;background:#C9CFD6;position:relative;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--done)}
.switch input:checked::after{left:19px}
.models{display:flex;flex-wrap:wrap;gap:8px;padding:16px 18px}
.savebar{position:sticky;bottom:0;margin-top:18px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px 12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.savebar .btn:not(.primary){color:var(--ink)}
.zone{display:grid;grid-template-columns:1fr 140px auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.zone:first-of-type{border-top:0}
.zone .fee{display:flex;align-items:center;gap:6px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days label{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;cursor:pointer;background:#fff}
.days input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.days label{position:relative}
.days label:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:2px}
.days label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.set{padding:18px;display:grid;gap:14px;max-width:560px}


/* catalog screens */
.plist{overflow:hidden}
.prow{display:grid;grid-template-columns:64px 1fr 150px 110px auto;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.pthumb{width:64px;height:64px;border-radius:12px;background:#F2F4F6;display:grid;place-items:center;overflow:hidden}
.pthumb img{max-width:100%;max-height:100%;object-fit:contain}
.dots{display:flex;flex-wrap:wrap;gap:3px;width:40px;justify-content:center}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);vertical-align:-3px}
.pinfo .muted{font-size:13.5px}
.pstock{font-size:14px}
.warn{color:var(--danger);font-weight:600;font-size:13px}
.pacts{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.icon{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:700}
.icon:disabled{opacity:.35;cursor:default}
.editor{display:grid;gap:14px;max-width:820px}
.set.wide{max-width:none}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.colours-ed{display:grid;gap:10px}
.crow{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.cimg{width:72px;height:72px;border-radius:10px;background:#F2F4F6;display:grid;place-items:center;overflow:hidden}
.cimg img{max-width:100%;max-height:100%;object-fit:contain}
.cimg span{width:34px;height:60px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cmain{display:grid;gap:8px}
.cline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cline input[type=color]{width:44px;height:40px;border:1px solid var(--line);border-radius:10px;padding:3px;background:#fff;cursor:pointer;flex:none}
.cline .in{flex:1;min-width:140px}
.cline.small .btn{padding:6px 11px;font-size:13px}
.upl{cursor:pointer}
.mchecks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.mcheck{display:flex;gap:8px;align-items:center;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.days label:has(input[type=radio]:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn.big{padding:11px 18px;font-size:15px}
.btn.danger-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.stock-wrap{padding:0;overflow:hidden}
.stock-tools{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:14px}
.stock-scroll{overflow-x:auto}
table.stock{border-collapse:collapse;width:100%;min-width:480px}
table.stock th,table.stock td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:center;font-size:14px;white-space:nowrap}
table.stock thead th{font-weight:600;color:var(--muted);background:#FAFBFC}
table.stock tbody th,table.stock tfoot th{text-align:left;font-weight:600}
table.stock .qty{width:72px;text-align:center;padding:6px}
table.stock .qty.zero{background:#FDECEA;border-color:#F3C2BD}
table.stock .qty.low{background:#FFF4DC;border-color:#F2D28D}
table.stock .tot{font-weight:700}
table.stock tfoot td,table.stock tfoot th{background:#FAFBFC;border-bottom:0}
.mform{margin-bottom:14px}
.mimg{width:56px;height:56px;border-radius:10px;background:#F2F4F6;display:grid;place-items:center;overflow:hidden}
.mimg img{max-width:100%;max-height:100%}
.mrow{grid-template-columns:64px 1fr 130px auto}
.warnpill{background:var(--danger)!important}
.modal{position:fixed;inset:0;background:rgba(21,24,28,.45);z-index:80;display:grid;place-items:center;padding:20px}
.mbox{background:#fff;border-radius:16px;padding:22px;width:min(420px,100%);display:grid;gap:14px}
.mbox p{margin:0;font-size:16px}
.mbox .actions{justify-content:flex-end}
@media (max-width:760px){
  .prow,.mrow{grid-template-columns:56px 1fr;gap:8px 12px}
  .prow .pstock,.prow>div:nth-child(4){grid-column:2}
  .pacts{grid-column:1/-1;justify-content:flex-start;flex-wrap:wrap}
  .row3{grid-template-columns:1fr}
  .crow{grid-template-columns:56px 1fr}
  .cimg{width:56px;height:56px}
}

@media (max-width:980px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside.side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;z-index:30;overflow-x:auto;gap:2px}
  .brand{padding:0 10px 0 4px;font-size:17px}
  .brand small,.side .grow,.side .foot{display:none}
  .nav{display:flex;gap:2px}
  .nav button{white-space:nowrap;padding:8px 10px;gap:6px}
  main{padding:20px 14px 60px}
  table.orders thead{display:none}
  table.orders,table.orders tbody,table.orders tr,table.orders td{display:block;width:100%}
  table.orders tr.row{border-bottom:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
  table.orders td{border:0;padding:0}
  table.orders td.c-items,table.orders td.c-area{display:none}
  table.orders td:nth-child(2),table.orders td:nth-child(6){text-align:right}
  table.orders td.num{grid-column:1/-1;text-align:left;margin-top:4px}
  .zone{grid-template-columns:1fr;gap:8px}
  .prod{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="login hidden" id="login">
  <form id="loginForm">
    <h1>Phones<span>NBO</span> admin</h1>
    <p>Log in to see orders.</p>
    <label class="f">Password<input class="in" type="password" name="password" autocomplete="current-password" required autofocus></label>
    <div class="err" id="loginErr" aria-live="polite"></div>
    <button class="btn primary" style="justify-content:center;padding:11px">Log in</button>
  </form>
</div>

<div class="shell hidden" id="app">
  <aside class="side">
    <div class="brand">Phones<span>NBO</span><small>Admin</small></div>
    <nav class="nav" aria-label="Dashboard sections">
      <button data-view="overview">Overview</button>
      <button data-view="orders">Orders <span class="pill" id="newPill"></span></button>
      <button data-view="products">Products</button>
      <button data-view="stock">Stock <span class="pill warnpill hidden" id="lowPill"></span></button>
      <button data-view="models">iPhone models</button>
      <button data-view="delivery">Delivery</button>
      <button data-view="settings">Settings</button>
    </nav>
    <div class="grow"></div>
    <div class="foot">
      <a href="/" target="_blank" rel="noopener">View shop</a>
      <button id="logout">Log out</button>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Order details">
  <div class="dhead"><h2 id="dTitle">Order</h2><button class="x" id="dClose" aria-label="Close">×</button></div>
  <div class="dbody" id="dBody"></div>
</aside>
<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalMsg">
  <div class="mbox"><p id="modalMsg"></p><div class="actions"><button class="btn" id="modalNo">Keep it</button><button class="btn danger-solid" id="modalOk">Delete</button></div></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="catalog.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KES = n => 'KES ' + Number(n || 0).toLocaleString('en-KE');
const STATUS = { new:'New', confirmed:'Confirmed', out:'Out for delivery', delivered:'Delivered', cancelled:'Cancelled' };
const NEXT = { new:['confirmed','Confirm order'], confirmed:['out','Send out for delivery'], out:['delivered','Mark delivered'] };
const nboDate = (d = new Date()) => new Date(d.getTime() + 3*3600e3).toISOString().slice(0,10);
const addDays = (iso, n) => new Date(Date.parse(iso) + n*864e5).toISOString().slice(0,10);
const timeNbo = iso => new Date(iso).toLocaleTimeString('en-KE', { hour:'numeric', minute:'2-digit', timeZone:'Africa/Nairobi' });
const dateNbo = iso => new Date(iso).toLocaleDateString('en-KE', { day:'numeric', month:'short', timeZone:'Africa/Nairobi' });
function dayLabel(iso){
  const t = nboDate(); if (iso === t) return 'Today'; if (iso === addDays(t,1)) return 'Tomorrow'; if (iso === addDays(t,-1)) return 'Yesterday';
  return new Date(iso + 'T00:00:00Z').toLocaleDateString('en-KE', { weekday:'short', day:'numeric', month:'short', timeZone:'UTC' });
}
const phoneIntl = p => '254' + String(p).replace(/^0/, '');

const S = { view: (location.hash || '#overview').slice(1), orders: [], settings: {}, base: null, demo: false,
  filter: 'open', when: 'all', q: '', openId: null, draft: null, dirty: false, lastNewCount: null,
  catalog: null, edit: null, stockId: null, sdraft: null, medit: null };

/* ---------- API (with a sample-data preview when there's no server) ---------- */
async function call(method, url, body){
  if (S.demo) return demoApi(method, url, body);
  const r = await fetch(url, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined, credentials:'same-origin' });
  const j = await r.json().catch(() => ({}));

let DEMO = null;
function demoApi(method, url, body){
  DEMO = DEMO || { orders: demoOrders(), settings: {}, catalog: (() => { const c = CATALOG.seed({}); const r = c.products.find(p => p.id === 'rugged');
    r.trackStock = true; c.models.forEach((m,i) => r.colors.forEach((col,j) => { r.stock[m.id+':'+col.id] = (i*3 + j*5) % 7; })); return c; })() };
  const C = DEMO.catalog, ok = x => JSON.parse(JSON.stringify(x));
  const sl = (n, taken) => { let b = String(n||'item').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'item', id = b, k = 2; while (taken.includes(id)) id = b + '-' + k++; return id; };
  if (url === '/api/admin/orders') return { orders: DEMO.orders };
  if (url === '/api/admin/settings' && method === 'GET') return { settings: DEMO.settings, base: { zones: CATALOG.zones, defaults: CATALOG.defaults } };
  if (url === '/api/admin/settings' && method === 'PUT') { DEMO.settings = body; return { settings: body }; }
  if (url === '/api/admin/catalog') return { catalog: ok(C) };
  if (url === '/api/admin/upload') return { url: body.dataUrl };
  if (url === '/api/admin/products' && method === 'POST') {
    if (!String(body.name||'').trim()) throw new Error('Give the case a name.');
    if (!(body.price >= 0)) throw new Error('Enter a price in KES.');
    const p = Object.assign(ok(body), { id: sl(body.name, C.products.map(x => x.id)), trackStock:false, stock:{} });
    p.colors.forEach((c,i) => { c.id = c.id || sl(c.n, p.colors.slice(0,i).map(x => x.id)); });
    C.products.push(p); return { product: p, catalog: ok(C) };
  }
  let m = url.match(/\/api\/admin\/products\/([\w-]+)(\/stock|\/move)?$/);
  if (m) { const i = C.products.findIndex(x => x.id === m[1]), cur = C.products[i];
    if (!m[2] && method === 'PUT') { const p = Object.assign(ok(body), { id: cur.id, trackStock: cur.trackStock, stock: cur.stock });
      p.colors.forEach((c,k) => { c.id = c.id || sl(c.n, p.colors.filter((_,j) => j !== k).map(x => x.id)); }); C.products[i] = p; return { product: p, catalog: ok(C) }; }
    if (!m[2] && method === 'DELETE') { C.products.splice(i,1); return { catalog: ok(C) }; }
    if (m[2] === '/stock') { cur.trackStock = body.trackStock; cur.stock = body.stock; return { product: cur, catalog: ok(C) }; }
    if (m[2] === '/move') { const j = i + (body.dir === 'up' ? -1 : 1); C.products.splice(i,1); C.products.splice(j,0,cur); return { catalog: ok(C) }; }
  }
  if (url === '/api/admin/models' && method === 'POST') {
    if (!String(body.name||'').trim() || !(body.h >= 100 && body.w >= 50)) throw new Error('Add a name, and height 100–200 mm and width 50–100 mm.');
    C.models.unshift(Object.assign(ok(body), { id: sl(body.name, C.models.map(x => x.id)), h:+body.h, w:+body.w })); return { catalog: ok(C) };
  }
  m = url.match(/\/api\/admin\/models\/([\w-]+)(\/move)?$/);
  if (m) { const i = C.models.findIndex(x => x.id === m[1]), cur = C.models[i];
    if (!m[2] && method === 'PUT') { C.models[i] = Object.assign(ok(body), { id: cur.id, h:+body.h, w:+body.w }); return { catalog: ok(C) }; }
    if (!m[2] && method === 'DELETE') { C.models.splice(i,1); C.products.forEach(p => { if (Array.isArray(p.fits)) p.fits = p.fits.filter(x => x !== cur.id); }); return { catalog: ok(C) }; }
    if (m[2]) { const j = i + (body.dir === 'up' ? -1 : 1); C.models.splice(i,1); C.models.splice(j,0,cur); return { catalog: ok(C) }; }
  }
  m = url.match(/\/api\/admin\/orders\/(.+)$/);
  if (m) { const o = DEMO.orders.find(x => x.id === m[1]);
    if (body.status && body.status !== o.status) { o.status = body.status; o.history.push({ at:new Date().toISOString(), status:body.status }); }
    ['paid','payMethod','adminNote'].forEach(k => { if (body[k] !== undefined) o[k] = body[k]; }); return { order:o }; }
  return {};
}

/* ---------- boot / auth ---------- */
async function boot(){
  try{
    const r = await fetch('/api/admin/me', { credentials:'same-origin' });
    const isJson = (r.headers.get('content-type') || '').includes('json');
    if (!isJson) { S.demo = true; return start(); }
    if (r.ok) return start();
    showLogin();
  }catch(e){ S.demo = true; start(); }
}
function showLogin(){ $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#loginErr').textContent = '';
  try{ await call('POST', '/api/admin/login', { password: e.target.password.value }); e.target.reset(); start(); }
  catch(err){ $('#loginErr').textContent = err.message; }
});
$('#logout').addEventListener('click', async () => { if (!S.demo) await call('POST','/api/admin/logout').catch(()=>{}); showLogin(); });

async function start(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  await Promise.all([loadOrders(), loadSettings(), reloadCatalog()]);
  if (S.view === 'product') S.view = 'products';
  render();
  clearInterval(S.timer); S.timer = setInterval(async () => { await loadOrders(true); const editing = S.dirty || S.edit || S.medit; if (!editing) { await reloadCatalog().catch(()=>{}); S.sdraft = null; renderView(); } }, 30e3);
}
async function loadOrders(quiet){
  try{
    const j = await call('GET', '/api/admin/orders'); S.orders = j.orders || [];
    const n = S.orders.filter(o => o.status === 'new').length;
    if (quiet && S.lastNewCount !== null && n > S.lastNewCount) { toast('New order in'); try{ navigator.vibrate && navigator.vibrate(150); }catch(e){} }
    S.lastNewCount = n;

  const top = Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,5);

const CAMS = [['plateau','Wide camera bar (17 Pro)'],['pro','Three lenses (Pro)'],['duo','Two lenses, diagonal'],['duov','Two lenses, stacked'],['single','One lens'],['bar1','Slim bar (Air)']];
const P = id => (S.catalog?.products || []).find(p => p.id === id);
const MD = id => (S.catalog?.models || []).find(m => m.id === id);
const fitsList = p => p.fits === 'all' ? S.catalog.models : S.catalog.models.filter(m => p.fits.includes(m.id));
const dot = c => `<i class="dot" style="background:${c.c}"></i>`;
function pThumb(p){ const c = p.colors.find(x => x.img); return c ? `<img src="${esc(c.img)}" alt="">` : `<span class="dots">${p.colors.slice(0,4).map(dot).join('')}</span>`; }
function stockTotals(p){
  if (!p.trackStock) return null;
  let total = 0, out = 0, low = 0;
  fitsList(p).forEach(m => p.colors.forEach(c => { const n = (p.stock||{})[m.id+':'+c.id] || 0; total += n; if (!n) out++; else if (n <= 2) low++; }));
  return { total, out, low };
}
function lowStock(){
  const rows = [];
  (S.catalog?.products || []).filter(p => p.trackStock && p.active !== false).forEach(p => fitsList(p).forEach(m => p.colors.forEach(c => {
    const n = (p.stock||{})[m.id+':'+c.id] || 0; if (n <= 2) rows.push({ p, m, c, n });
  })));
  return rows.sort((a,b) => a.n - b.n);
}

  if (!S.sdraft || S.sdraft.id !== p.id) S.sdraft = { id: p.id, trackStock: !!p.trackStock, stock: Object.assign({}, p.stock || {}) };
  const d = S.sdraft, ms = fitsList(p);
  let grand = 0; const colTot = p.colors.map(() => 0);
  const rows = ms.map(m => { let rt = 0;
    const cells = p.colors.map((c, ci) => { const k = m.id + ':' + c.id, n = d.stock[k] ?? 0; rt += n; colTot[ci] += n;

function updateStockTotals(){
  const p = P(S.stockId); if (!p || !S.sdraft) return;
  let grand = 0; const ct = {};
  fitsList(p).forEach(m => { let rt = 0; p.colors.forEach(c => { const n = S.sdraft.stock[m.id+':'+c.id] || 0; rt += n; ct[c.id] = (ct[c.id]||0) + n; });
    grand += rt; const el = document.querySelector(`[data-rt="${m.id}"]`); if (el) el.textContent = rt; });
  p.colors.forEach(c => { const el = document.querySelector(`[data-ct="${c.id}"]`); if (el) el.textContent = ct[c.id] || 0; });
  document.querySelectorAll('[data-grand]').forEach(el => el.textContent = grand);
}

/* photo upload: shrink in the browser, then send */
function shrink(file, max = 1200){
  return new Promise((resolve, reject) => {
    if (!/^image\/(png|jpeg|webp)$/.test(file.type)) return reject(new Error('Upload a PNG, JPG or WebP photo.'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL(file.type === 'image/jpeg' ? 'image/jpeg' : 'image/png', .86));
    };
    img.onerror = () => reject(new Error('Couldn’t read that photo. Try another file.'));
    img.src = url;
  });
}
async function uploadPhoto(file){
  toast('Uploading photo…');
  const dataUrl = await shrink(file);
  const j = await call('POST', '/api/admin/upload', { dataUrl });
  return j.url;
}

/* in-page confirm */
function ask(msg, ok = 'Delete'){
  return new Promise(res => {
    $('#modalMsg').textContent = msg; $('#modalOk').textContent = ok; $('#modal').classList.remove('hidden'); $('#modalOk').focus();
    const done = v => { $('#modal').classList.add('hidden'); $('#modalOk').onclick = $('#modalNo').onclick = null; res(v); };
    $('#modalOk').onclick = () => done(true); $('#modalNo').onclick = () => done(false);
  });
}

async function saveProduct(){
  const d = S.edit, body = Object.assign({}, d, { price: Number(d.price) });

/* ---------- events ---------- */
async function go(view){
  S.view = view; history.replaceState(null, '', '#' + view);
  if (['overview','products','stock','models'].includes(view) && !S.edit && !S.medit) { try{ await reloadCatalog(); }catch(e){} }
  if (view === 'overview' || view === 'orders') await loadOrders(true);
  render(); window.scrollTo(0, 0);
}
document.addEventListener('click', async e => {
  const t = e.target.closest('button, a, tr[data-open], tr[data-gostock]'); if (!t || t.disabled) return;
  if (t.dataset.gostock){ S.stockId = t.dataset.gostock; S.sdraft = null; go('stock'); return; }
  if (t.dataset.view){ if (S.dirty) { S.draft = null; S.dirty = false; } S.sdraft = null; S.edit = null; S.medit = null; go(t.dataset.view); return; }
  if (t.dataset.open){ openOrder(t.dataset.open); return; }
  if (t.dataset.filter){ S.filter = t.dataset.filter; renderView(); return; }
  if (t.id === 'dClose'){ closeOrder(); return; }
  if (t.dataset.status){
    const s = t.dataset.status;
    if (s === 'cancelled' && !(await ask('Cancel this order? Any counted stock goes back on the shelf.', 'Cancel order'))) return;
    patchOrder({ status: s }, { confirmed:'Order confirmed', out:'Marked out for delivery', delivered:'Marked delivered', cancelled:'Order cancelled', new:'Order reopened' }[s]);
    return;
  }
  if (t.dataset.pay){ patchOrder({ payMethod: t.dataset.pay, paid: true }, 'Payment recorded'); return; }
  if (t.id === 'saveNote'){ patchOrder({ adminNote: $('#adminNote').value }, 'Note saved'); return; }
  if (t.id === 'saveSettings'){ saveSettings(); return; }
  if (t.id === 'discard'){ S.draft = null; S.sdraft = null; S.dirty = false; renderView(); return; }
  if (t.getAttribute('aria-disabled') === 'true'){ e.preventDefault(); toast('CSV download works once the site is live.'); return; }

  /* products */
  if (t.hasAttribute('data-newprod')){ S.edit = newProduct(); go('product'); return; }
  if (t.dataset.editprod){ S.edit = JSON.parse(JSON.stringify(P(t.dataset.editprod))); go('product'); return; }
  if (t.dataset.pmove){ try{ S.catalog = (await call('POST', `/api/admin/products/${t.dataset.pmove}/move`, { dir: t.dataset.dir })).catalog; renderView(); }catch(err){ toast(err.message); } return; }
  if (t.hasAttribute('data-cadd')){ S.edit.colors.push({ n:'', c:'#9CC3E4', soldOut:false }); renderView(); const ins = document.querySelectorAll('[data-cf="n"]'); ins[ins.length-1].focus(); return; }
  if (t.dataset.crm !== undefined){ S.edit.colors.splice(+t.dataset.crm, 1); renderView(); return; }
  if (t.dataset.cimgrm !== undefined){ delete S.edit.colors[+t.dataset.cimgrm].img; renderView(); return; }
  if (t.hasAttribute('data-psave')){ saveProduct(); return; }
  if (t.dataset.pdel){
    const p = P(t.dataset.pdel);
    if (!(await ask(`Delete ${p.name}? It comes off the shop and its stock is removed. Past orders keep their details.`, 'Delete product'))) return;
    try{ S.catalog = (await call('DELETE', `/api/admin/products/${p.id}`)).catalog; S.edit = null; go('products'); toast(`${p.name} deleted`); }catch(err){ toast(err.message); }
    return;
  }

  /* stock */
  if (t.dataset.stockof){ if (S.dirty) { S.sdraft = null; S.dirty = false; } S.stockId = t.dataset.stockof; S.sdraft = null; if (S.view !== 'stock') go('stock'); else renderView(); return; }
  if (t.hasAttribute('data-fill')){ const v = Math.max(0, Math.floor(Number($('#fillAll').value) || 0)); const p = P(S.stockId);
    fitsList(p).forEach(m => p.colors.forEach(c => { S.sdraft.stock[m.id+':'+c.id] = v; })); markDirtyRender(); return; }
  if (t.id === 'saveStock'){
    try{ const j = await call('PUT', `/api/admin/products/${S.stockId}/stock`, { trackStock: S.sdraft.trackStock, stock: S.sdraft.stock });
      S.catalog = j.catalog; S.sdraft = null; S.dirty = false; renderView(); toast('Stock saved. The shop is updated.'); }catch(err){ toast(err.message); }
    return;
  }

  /* models */
  if (t.hasAttribute('data-mnew')){ S.medit = { name:'', h:'', w:'', cam:'pro' }; renderView(); $('[data-mf="name"]').focus(); return; }
  if (t.dataset.medit){ S.medit = JSON.parse(JSON.stringify(MD(t.dataset.medit))); renderView(); return; }
  if (t.hasAttribute('data-mcancel')){ S.medit = null; renderView(); return; }
  if (t.hasAttribute('data-mimgrm')){ delete S.medit.photo; renderView(); return; }
  if (t.hasAttribute('data-msave')){
    const m = S.medit;
    try{ const j = m.id ? await call('PUT', `/api/admin/models/${m.id}`, m) : await call('POST', '/api/admin/models', m);
      S.catalog = j.catalog; S.medit = null; renderView(); toast(m.id ? 'Saved' : `${m.name} added. Tick it in any case that fits it.`); }
    catch(err){ $('#merr').textContent = err.message; }
    return;
  }
  if (t.dataset.mmove){ try{ S.catalog = (await call('POST', `/api/admin/models/${t.dataset.mmove}/move`, { dir: t.dataset.dir })).catalog; renderView(); }catch(err){ toast(err.message); } return; }
  if (t.dataset.mdel){
    const m = MD(t.dataset.mdel);
    if (!(await ask(`Delete ${m.name}? It comes off the picker and its stock counts are removed from every case.`, 'Delete model'))) return;
    try{ S.catalog = (await call('DELETE', `/api/admin/models/${m.id}`)).catalog; renderView(); toast(`${m.name} deleted`); }catch(err){ toast(err.message); }
    return;
  }
});
function markDirtyRender(){ S.dirty = true; renderView(); }

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q'){ S.q = el.value; const pos = el.selectionStart; renderView(); const n = $('#q'); n.focus(); n.setSelectionRange(pos,pos); return; }
  if (el.dataset.pf && S.edit && el.type !== 'checkbox'){ S.edit[el.dataset.pf] = el.value; return; }
  if (el.dataset.cf && S.edit && el.type !== 'checkbox'){
    const c = S.edit.colors[+el.dataset.ci]; c[el.dataset.cf] = el.value;
    if (el.dataset.cf === 'c'){ const sw = el.closest('.crow').querySelector('.cimg span'); if (sw) sw.style.background = el.value; }
    return;
  }
  if (el.dataset.mf && S.medit){ S.medit[el.dataset.mf] = el.value; return; }
  if (el.dataset.sk && S.sdraft){
    const n = Math.max(0, Math.floor(Number(el.value) || 0)); S.sdraft.stock[el.dataset.sk] = n;
    el.classList.toggle('zero', n === 0); el.classList.toggle('low', n > 0 && n <= 2); markDirty(); updateStockTotals(); return;
  }
  if (S.view !== 'delivery' && S.view !== 'settings') return;
  const d = draft();
  if (el.dataset.fee !== undefined){ const v = Math.round(Number(el.value)); if (v >= 0) d.zoneFees[el.dataset.fee] = v; markDirty(); }
  if (el.id === 'wa'){ d.whatsapp = el.value; markDirty(); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.id === 'when'){ S.when = el.value; renderView(); return; }
  if (el.dataset.pf && S.edit && el.type === 'checkbox'){ if (el.dataset.pf === 'active') S.edit.active = el.checked; else S.edit.soldOut = !el.checked; return; }
  if (el.dataset.cf === 'soldOut' && S.edit){ S.edit.colors[+el.dataset.ci].soldOut = !el.checked; return; }
  if (el.name === 'fitsall' && S.edit){ S.edit.fits = el.value === 'all' ? 'all' : (Array.isArray(S.edit.fits) ? S.edit.fits : []); renderView(); return; }
  if (el.dataset.fit && S.edit){ const set = new Set(S.edit.fits); el.checked ? set.add(el.dataset.fit) : set.delete(el.dataset.fit); S.edit.fits = S.catalog.models.map(m => m.id).filter(id => set.has(id)); return; }
  if (el.dataset.cimg !== undefined && el.files[0]){
    try{ const url = await uploadPhoto(el.files[0]); S.edit.colors[+el.dataset.cimg].img = url; renderView(); toast('Photo added. Save to put it on the shop.'); }catch(err){ toast(err.message); }
    return;
  }
  if (el.hasAttribute('data-mimg') && el.files[0]){
    try{ const url = await uploadPhoto(el.files[0]); S.medit.photo = url; renderView(); toast('Photo added. Save to put it on the shop.'); }catch(err){ toast(err.message); }
    return;
  }
  if (el.dataset.mvis){
    const m = MD(el.dataset.mvis);
    try{ S.catalog = (await call('PUT', `/api/admin/models/${m.id}`, Object.assign({}, m, { hidden: !el.checked }))).catalog; toast(el.checked ? `${m.name} is on the shop` : `${m.name} hidden from the shop`); }catch(err){ toast(err.message); }
    return;
  }
  if (el.id === 'trackStock' && S.sdraft){ S.sdraft.trackStock = el.checked; markDirtyRender(); return; }
  if (S.view !== 'delivery' && S.view !== 'settings') return;
  const d = draft();
  if (el.dataset.zoneon){ if (el.checked) delete d.zoneOff[el.dataset.zoneon]; else d.zoneOff[el.dataset.zoneon] = true; markDirty(); }
  if (el.id === 'cutoff'){ d.cutoffHour = Number(el.value); markDirty(); }
  if (el.dataset.day !== undefined){ const set = new Set(d.deliveryDays || CATALOG.defaults.deliveryDays); el.checked ? set.add(+el.dataset.day) : set.delete(+el.dataset.day); d.deliveryDays = [...set].sort(); markDirty(); }
});
$('#scrim').addEventListener('click', closeOrder);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').classList.contains('hidden')) { $('#modalNo').click(); return; }
  if (e.key === 'Escape' && S.openId) closeOrder();
});
window.addEventListener('beforeunload', e => { if (S.dirty || S.edit) { e.preventDefault(); e.returnValue = ''; } });

let tt; function toast(m){ const el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2400); }
boot();
</script>
</body>
</html>
